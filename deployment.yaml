apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: journal-api

  template:
    metadata:
      labels:
        app: journal-api

    spec:
      containers:
        - name: journal-api
          image: 362976989244.dkr.ecr.us-east-1.amazonaws.com/jj/journalapi:cea6d9e6136dc3e58025bb9d2d3baaa80805358e
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
          - name: DATABASE_URL
            value: "postgresql://postgres:postgres@postgres-service:5432/testdb"

          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: journal-secrets
                key: OPENAI_API_KEY

          - name: OPENAI_BASE_URL
            valueFrom:
              secretKeyRef:
                name: journal-secrets
                key: OPENAI_BASE_URL

          - name: OPENAI_MODEL
            valueFrom:
              secretKeyRef:
                name: journal-secrets
                key: OPENAI_MODEL