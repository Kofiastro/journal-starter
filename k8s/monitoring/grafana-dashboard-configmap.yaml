apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-journal-dashboard
  labels:
    app: grafana
data:
  journal-api-overview.json: |
    {
      "id": null,
      "uid": "journal-api-overview",
      "title": "Journal API Overview",
      "tags": ["journal-api", "observability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Rate (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m]))",
              "legendFormat": "total"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx Error Rate",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1)",
              "legendFormat": "5xx ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "P95 Latency (s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Journal API Pod Health (up)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(up{job=\"journal-api\"})",
              "legendFormat": "up"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value"
          }
        }
      ],
      "time": {
        "from": "now-30m",
        "to": "now"
      }
    }
